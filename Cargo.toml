[package]
name = "sheetdiff"
version = "0.1.0"
edition = "2021"
description = "Offline cell-level Excel and CSV diffs for code review"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zz0639607-art/sheetdiff"
homepage = "https://github.com/zz0639607-art/sheetdiff#readme"
keywords = ["xlsx", "csv", "diff", "git", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/demo.gif", "dist/"]

[[bin]]
name = "sheetdiff"
path = "src/main.rs"

[dependencies]
anyhow = "1"
calamine = "0.37"
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7.2"
csv = "1.4"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
rust_xlsxwriter = "0.101"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
